<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <g id="arm">
      <line x1="50" y1="44" x2="50" y2="12"/>
      <polyline points="43,19 50,26 57,19"/>
    </g>
  </defs>
  <g fill="none" stroke="#0277bd" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="5.5"/>
    <use href="#arm" transform="rotate(90 50 50)"/>
    <use href="#arm" transform="rotate(150 50 50)"/>
    <use href="#arm" transform="rotate(270 50 50)"/>
    <use href="#arm" transform="rotate(330 50 50)"/>
    <!-- one arm is an open-end wrench -->
    <path transform="rotate(30 50 50)" d="M46.5 41 L46.5 29.37 A10 10 0 0 1 46.5 10.63 L46.5 17 L53.5 17 L53.5 10.63 A10 10 0 0 1 53.5 29.37 L53.5 41 A3.5 3.5 0 0 1 46.5 41 Z"/>
    <!-- another arm is a screwdriver -->
    <g transform="rotate(210 50 50)">
      <line x1="50" y1="44" x2="50" y2="28"/>
      <rect x="45.5" y="9" width="9" height="19" rx="4.5"/>
      <line x1="50" y1="13.5" x2="50" y2="23.5"/>
    </g>
  </g>
</svg>
